name: API contract tests

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'scripts/test_staging_api.mjs'
      - '.github/workflows/api-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # One step on purpose: the Worker has to stay up while the suite runs.
      - name: Run the contract suite against a local Worker
        run: |
          set -euo pipefail
          MIGRATE="npx --no-install wrangler d1 migrations apply labu-staging --local --config workers/api/wrangler.jsonc"
          # 0002 and 0003 alter the Better Auth tables, which only exist after the
          # setup endpoint runs, so the apply happens twice: 0001 first, the rest
          # once the auth schema is in place.
          # Fails on 0002/0003 while the auth tables are missing; the second run
          # below is the one that has to pass.
          $MIGRATE || true

          npx --no-install wrangler dev --config workers/api/wrangler.jsonc --port 8791 \
            --var SETUP_TOKEN:ci-setup-token \
            --var ADMIN_EMAILS:ci-admin@example.test \
            --var BETTER_AUTH_SECRET:ci-only-secret-that-is-never-deployed \
            --var BETTER_AUTH_URL:http://127.0.0.1:8791 \
            --var CORS_ORIGINS:http://127.0.0.1:8791,https://labu.lengkhawm.online \
            > /tmp/wrangler.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID" 2>/dev/null || true; echo "--- worker log ---"; tail -60 /tmp/wrangler.log' EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8791/api/health > /dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then echo "worker never became ready"; exit 1; fi

          curl -fsS -X POST http://127.0.0.1:8791/api/setup/migrate \
            -H 'x-setup-token: ci-setup-token' -H 'Content-Type: application/json' -d '{}'
          $MIGRATE
          curl -fsS -X POST http://127.0.0.1:8791/api/setup/admin \
            -H 'x-setup-token: ci-setup-token' -H 'Content-Type: application/json' \
            -d '{"email":"ci-admin@example.test","password":"ci-admin-password-123","name":"CI Admin"}'

          # The overlay checks expect the database to already carry a row.
          curl -fsS -c /tmp/ci-cookies.txt -X POST http://127.0.0.1:8791/api/auth/sign-in/email \
            -H 'Origin: https://labu.lengkhawm.online' -H 'Content-Type: application/json' \
            -d '{"email":"ci-admin@example.test","password":"ci-admin-password-123"}' > /dev/null
          curl -fsS -b /tmp/ci-cookies.txt -X POST http://127.0.0.1:8791/api/admin/publish \
            -H 'Origin: https://labu.lengkhawm.online' -H 'Content-Type: application/json' \
            -d '{"kind":"song","payload":{"id":"ci_seed_hymn","cat":"B&P","op":"update","song":{"id":"ci_seed_hymn","title":"CI Seed Hymn","verses":[]}}}'

          LABU_TEST_EMAIL=ci-admin@example.test \
          LABU_TEST_PASSWORD=ci-admin-password-123 \
          LABU_SETUP_TOKEN=ci-setup-token \
            node scripts/test_staging_api.mjs
