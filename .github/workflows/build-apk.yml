name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          npm ci
          sudo apt-get update && sudo apt-get install -y imagemagick

      # ponytail: cheap corpus integrity check on every push — catches bad IDs,
      # broken verses, or a gzip/songs.json mismatch before they ship to users.
      - name: Validate corpus data
        run: python3 scripts/validate_data.py

      - name: Sync web assets
        run: |
          mkdir -p www
          cp index.html logo.png songs.json songs.json.gzip groups.json www/
          cp manifest.webmanifest sw.js icon-192.png icon-512.png www/
          cp -r assets www/ 2>/dev/null || true

      - name: Set APP_VERSION from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          sed -i "s/const APP_VERSION = '[^']*';/const APP_VERSION = '${VERSION}';/" index.html
          cp index.html www/

      # ponytail: package the web bundle for in-app OTA updates. The APK ships with
      # @capgo/capacitor-updater (manual mode, no cloud), which downloads this zip
      # from the GitHub Release and applies it in place — users never reinstall the APK.
      # When OTA_SIGNING_PRIVATE_KEY is set (recommended), the bundle is code-signed:
      # `bundle encrypt` AES-encrypts the zip and RSA-signs the checksum + session key
      # with the private key; the app holds the public key (capacitor.config.json) and
      # verifies before installing. The per-bundle session data rides in ota-session.json.
      - name: Package + sign OTA bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          OTA_SIGNING_PRIVATE_KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
        run: |
          cd www
          zip -rq ../www-latest.zip .
          cd ..
          ls -lh www-latest.zip
          if [ -n "$OTA_SIGNING_PRIVATE_KEY" ]; then
            echo "$OTA_SIGNING_PRIVATE_KEY" > /tmp/ota-private.pem
            chmod 600 /tmp/ota-private.pem
            # --no-code-check: this app ships as a single index.html (no .js files), which
            # the CLI's notifyAppReady() scan can't see — the call IS present, guarded.
            ZJSON=$(npx --yes @capgo/cli@latest bundle zip org.khristianlabu.app --path ./www --bundle "${TAG#v}" --json --no-code-check)
            ZIP=$(echo "$ZJSON" | python3 -c "import sys,json;print(json.load(sys.stdin)['filename'])")
            CS=$(echo "$ZJSON" | python3 -c "import sys,json;print(json.load(sys.stdin)['checksum'])")
            npx --yes @capgo/cli@latest bundle encrypt "$ZIP" "$CS" --key /tmp/ota-private.pem --json > /tmp/ota-session.json
            mv "${ZIP}_encrypted.zip" www-latest.zip
            python3 -c "import json; j=json.load(open('/tmp/ota-session.json')); json.dump({'version':'${TAG#v}','sessionKey':j['ivSessionKey'],'checksum':j['checksum']}, open('ota-session.json','w'))"
            rm -f /tmp/ota-private.pem "$ZIP"
            echo "OTA bundle signed — ota-session.json written"
          else
            echo '{"version":"'${TAG#v}'","sessionKey":"","checksum":""}' > ota-session.json
            echo "OTA_SIGNING_PRIVATE_KEY not set — attaching unsigned bundle"
          fi

      # ponytail: the heavy Android/Gradle build only runs on version tags or manual
      # dispatch. Plain pushes to main just update the web app (Pages serves main root),
      # so they skip the APK entirely and save CI minutes.
      - name: Add Android platform
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        run: npx cap add android

      - name: Configure signing
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/khristian-labu.keystore
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=khristian-labu.keystore
          EOF
          sed -i 's/^          //g' android/key.properties
          sed -i 's|def keystorePropertiesFile = rootProject.file("key.properties")|def keystorePropertiesFile = rootProject.file("key.properties")\n    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))|' android/app/build.gradle || true

      - name: Inject signing config
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cat > android/app/signing.gradle <<'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file("khristian-labu.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

          # Append signing config to build.gradle if not already present
          if ! grep -q "signingConfigs" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            cat android/app/signing.gradle >> android/app/build.gradle
          fi

      - name: Sync Capacitor
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        run: npx cap sync android

      - name: Set app icon
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        run: |
          SIZES="mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192"
          for entry in $SIZES; do
            density="${entry%%:*}"
            size="${entry##*:}"
            convert assets/logo.svg -resize ${size}x${size} android/app/src/main/res/mipmap-${density}/ic_launcher.png
            convert assets/logo.svg -resize ${size}x${size} android/app/src/main/res/mipmap-${density}/ic_launcher_round.png
            convert assets/logo.svg -resize ${size}x${size} android/app/src/main/res/mipmap-${density}/ic_launcher_foreground.png
          done
          # Also replace adaptive icon foreground for anydpi-v26
          if [ -d android/app/src/main/res/mipmap-anydpi-v26 ]; then
            convert assets/logo.svg -resize 432x432 android/app/src/main/res/drawable/ic_launcher_foreground.png 2>/dev/null || true
          fi
          # Remove anydpi adaptive XML so PNG icons are used directly
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Build APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          if [ -f key.properties ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Rename APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/khristian-labu.apk
          else
            mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/khristian-labu-debug.apk
          fi

      - name: Upload APK as artifact
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: khristian-labu-apk
          path: |
            android/app/build/outputs/apk/release/khristian-labu.apk
            android/app/build/outputs/apk/debug/khristian-labu-debug.apk

      - name: Generate changelog
        id: changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          if [ -z "$PREV" ]; then
            git log --oneline --no-decorate | head -50 >> $GITHUB_OUTPUT
          else
            git log --oneline --no-decorate $PREV..HEAD >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            android/app/build/outputs/apk/release/khristian-labu.apk
            android/app/build/outputs/apk/debug/khristian-labu-debug.apk
            www-latest.zip
            ota-session.json

      # ponytail: mirror the per-release session data (sessionKey/checksum) into the
      # committed version.json. The app reads version.json from raw.githubusercontent
      # (CORS-open) to DETECT the update; the release-CDN copy of ota-session.json is
      # CORS-BLOCKED for a webview fetch, so the session data must ride in the same
      # CORS-open file the app already fetches. Without this, in-app OTA on APKs
      # silently fell back to the GitHub download banner every time.
      - name: Mirror session data into version.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYEOF'
          import json, base64, os, urllib.request, urllib.error

          repo = os.environ.get('GITHUB_REPOSITORY', 'minatolun-dotcom/khristian-labu')
          token = os.environ['GH_TOKEN']
          tag = os.environ['TAG'].lstrip('v')
          sess = json.load(open('ota-session.json'))

          # read current version.json from the default branch
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/contents/version.json',
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'User-Agent': 'labu-ci'},
          )
          cur = json.load(urllib.request.urlopen(req))
          data = json.loads(base64.b64decode(cur['content']).decode())

          # inject this release's session data (only when present and signed)
          if sess.get('sessionKey') and sess.get('checksum'):
              data['sessionKey'] = sess['sessionKey']
              data['checksum'] = sess['checksum']
              data['otaVersion'] = tag

          body = json.dumps(data, indent=2, ensure_ascii=False) + '\n'
          payload = json.dumps({
              'message': f'chore: mirror OTA session data for v{tag} into version.json',
              'content': base64.b64encode(body.encode()).decode(),
              'sha': cur['sha'],
          }).encode()
          put = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/contents/version.json',
              data=payload, method='PUT',
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'User-Agent': 'labu-ci', 'Content-Type': 'application/json'},
          )
          try:
              urllib.request.urlopen(put)
              print('version.json updated with session data for', tag)
          except urllib.error.HTTPError as e:
              print('WARN: could not update version.json:', e.code, e.read()[:200])
          PYEOF

      # Note: version.json and APP_VERSION are committed directly in the repo
      # (see index.html). We do NOT push back to main from CI — that reset main
      # to the tag checkout and broke on any divergence.
