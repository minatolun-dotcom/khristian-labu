name: Deploy website to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'songs.json'
      - 'songs.json.gzip'
      - 'groups.json'
      - 'chords.json'
      - 'manifest.webmanifest'
      - 'version.json'
      - 'logo.png'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'assets/**'
      - 'pages/**'
      - 'scripts/build-pages.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Pages staging directory
        run: npm run build:pages

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.0 pages deploy dist --project-name=khristian-labu --branch=main
